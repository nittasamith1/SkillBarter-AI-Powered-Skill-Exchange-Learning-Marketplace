spring:
  datasource:
    url: jdbc:h2:mem:skillbarter_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: test-secret-for-unit-tests-only-not-used-in-production-256-bits-long
    access-expiration-ms: 300000
    refresh-expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  rate-limit:
    login-max-requests: 100
    login-window-minutes: 1
    register-max-requests: 100
    register-window-minutes: 1

logging:
  level:
    root: WARN
    com.skillbarter: INFO
